<!doctype html>
<html lang="en" data-type="software" data-radius="sharp" data-buttons="tonal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="page-type" content="software" />
    <meta name="site-kind" content="software" />
    <title>Agentic Orchestrator: a spec-driven template for AI coding agents</title>
    <meta
      name="description"
      content="A Vite and React 19 starter with nine rule files and a spec for every component, so a coding agent builds to your team's standards."
    />
    <meta property="og:title" content="Agentic Orchestrator" />
    <meta
      property="og:description"
      content="Rule files, component specs and agent workflows in one template for frontend teams."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/share.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0a0d14" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- canonical: add once the production domain is known -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700..900&family=Geist:wght@400..700&family=Geist+Mono:wght@400..500&display=swap"
      rel="stylesheet"
    />
    <!-- Critical CSS: themed ground and loading line before the bundle arrives -->
    <style>
      html,
      body {
        margin: 0;
        background: #0a0d14;
        color: #e9edf3;
      }
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font: 500 13px/1 "Geist Mono", ui-monospace, Menlo, monospace;
        color: #8891a1;
      }
      #root:empty::after {
        content: "Loading the orchestrator";
        animation: boot 1.5s ease-in-out infinite;
      }
      @keyframes boot {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #root:empty::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
