<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentic Orchestrator</title>
    <meta name="description" content="A Three.js + React template where AI agents build from shared rules, written specs and reusable skills — for learning apps and interactive demos." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet" />
    <!-- Critical CSS: Handled manually for instant first paint -->
    <style>
      /* Mirrors the ink/paper tokens in src/index.css for first paint */
      :root {
        --bg-color: #080c18;
        --text-color: #eef1f8;
        color-scheme: dark;
      }
      body {
        margin: 0;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: "Instrument Sans", system-ui, -apple-system, sans-serif;
      }
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
      }
      #root:empty::after {
        content: "Tuning the orchestra…";
        font-weight: 500;
        letter-spacing: 0.05em;
        opacity: 0.8;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      @media (prefers-reduced-motion: reduce) {
        #root:empty::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root" role="status" aria-live="polite" aria-label="Application loading"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
